<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>MCP Memory Dashboard</title>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      :root {
        --bg: #0f1117;
        --surface: #1a1d27;
        --surface2: #242837;
        --border: #2d3248;
        --text: #e4e6f0;
        --text-dim: #8b8fa3;
        --accent: #6366f1;
        --accent-hover: #818cf8;
        --green: #22c55e;
        --red: #ef4444;
        --yellow: #eab308;
      }
      body {
        font-family:
          system-ui,
          -apple-system,
          sans-serif;
        background: var(--bg);
        color: var(--text);
        min-height: 100vh;
      }
      .sidebar {
        position: fixed;
        left: 0;
        top: 0;
        bottom: 0;
        width: 220px;
        background: var(--surface);
        border-right: 1px solid var(--border);
        padding: 20px 0;
        z-index: 10;
      }
      .sidebar h1 {
        font-size: 16px;
        padding: 0 20px 20px;
        border-bottom: 1px solid var(--border);
        color: var(--accent);
      }
      .sidebar nav a {
        display: flex;
        align-items: center;
        gap: 10px;
        padding: 10px 20px;
        color: var(--text-dim);
        text-decoration: none;
        font-size: 14px;
        transition: all 0.15s;
      }
      .sidebar nav a:hover,
      .sidebar nav a.active {
        color: var(--text);
        background: var(--surface2);
      }
      .sidebar nav a.active {
        border-right: 3px solid var(--accent);
      }
      .main {
        margin-left: 220px;
        padding: 24px;
      }
      .header {
        display: flex;
        justify-content: space-between;
        align-items: center;
        margin-bottom: 24px;
      }
      .header h2 {
        font-size: 20px;
      }
      .status-badge {
        display: inline-flex;
        align-items: center;
        gap: 6px;
        padding: 4px 12px;
        border-radius: 20px;
        font-size: 12px;
        font-weight: 600;
      }
      .status-badge.ok {
        background: rgba(34, 197, 94, 0.15);
        color: var(--green);
      }
      .status-badge.err {
        background: rgba(239, 68, 68, 0.15);
        color: var(--red);
      }
      .status-badge .dot {
        width: 8px;
        height: 8px;
        border-radius: 50%;
        background: currentColor;
      }
      .cards {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
        gap: 16px;
        margin-bottom: 24px;
      }
      .card {
        background: var(--surface);
        border: 1px solid var(--border);
        border-radius: 12px;
        padding: 20px;
      }
      .card .label {
        font-size: 12px;
        color: var(--text-dim);
        text-transform: uppercase;
        letter-spacing: 0.5px;
      }
      .card .value {
        font-size: 28px;
        font-weight: 700;
        margin-top: 4px;
      }
      .panel {
        background: var(--surface);
        border: 1px solid var(--border);
        border-radius: 12px;
        padding: 20px;
        margin-bottom: 16px;
      }
      .panel h3 {
        font-size: 14px;
        margin-bottom: 16px;
        color: var(--text-dim);
      }
      table {
        width: 100%;
        border-collapse: collapse;
        font-size: 13px;
      }
      th,
      td {
        text-align: left;
        padding: 10px 12px;
        border-bottom: 1px solid var(--border);
      }
      th {
        color: var(--text-dim);
        font-weight: 600;
        font-size: 11px;
        text-transform: uppercase;
      }
      tr:hover td {
        background: var(--surface2);
      }
      .tag {
        display: inline-block;
        padding: 2px 8px;
        border-radius: 4px;
        font-size: 11px;
        font-weight: 600;
      }
      .tag.pending {
        background: rgba(234, 179, 8, 0.15);
        color: var(--yellow);
      }
      .tag.active,
      .tag.in_progress {
        background: rgba(99, 102, 241, 0.15);
        color: var(--accent);
      }
      .tag.completed {
        background: rgba(34, 197, 94, 0.15);
        color: var(--green);
      }
      .tag.blocked {
        background: rgba(239, 68, 68, 0.15);
        color: var(--red);
      }
      .tag.bug {
        background: rgba(239, 68, 68, 0.15);
        color: var(--red);
      }
      .tag.note {
        background: rgba(99, 102, 241, 0.15);
        color: var(--accent);
      }
      .tag.blocker {
        background: rgba(239, 68, 68, 0.25);
        color: #f87171;
      }
      .tag.insight {
        background: rgba(34, 197, 94, 0.15);
        color: var(--green);
      }
      .activity-list {
        max-height: 400px;
        overflow-y: auto;
      }
      .activity-item {
        padding: 10px 0;
        border-bottom: 1px solid var(--border);
        display: flex;
        gap: 12px;
        font-size: 13px;
      }
      .activity-item:last-child {
        border: none;
      }
      .activity-time {
        color: var(--text-dim);
        min-width: 70px;
        font-size: 11px;
      }
      .search-bar {
        display: flex;
        gap: 8px;
        margin-bottom: 16px;
      }
      .search-bar input {
        flex: 1;
        padding: 10px 14px;
        background: var(--surface2);
        border: 1px solid var(--border);
        border-radius: 8px;
        color: var(--text);
        font-size: 13px;
        outline: none;
      }
      .search-bar input:focus {
        border-color: var(--accent);
      }
      .btn {
        padding: 8px 16px;
        border: none;
        border-radius: 8px;
        cursor: pointer;
        font-size: 13px;
        font-weight: 600;
        transition: all 0.15s;
      }
      .btn-primary {
        background: var(--accent);
        color: white;
      }
      .btn-primary:hover {
        background: var(--accent-hover);
      }
      .btn-sm {
        padding: 4px 10px;
        font-size: 11px;
      }
      .grid-2 {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 16px;
      }
      #login-screen {
        display: flex;
        align-items: center;
        justify-content: center;
        min-height: 100vh;
      }
      .login-box {
        background: var(--surface);
        border: 1px solid var(--border);
        border-radius: 16px;
        padding: 40px;
        width: 360px;
      }
      .login-box h2 {
        margin-bottom: 24px;
        text-align: center;
      }
      .login-box input {
        width: 100%;
        padding: 12px;
        margin-bottom: 12px;
        background: var(--surface2);
        border: 1px solid var(--border);
        border-radius: 8px;
        color: var(--text);
        font-size: 14px;
      }
      .login-box .btn {
        width: 100%;
        padding: 12px;
        margin-top: 8px;
      }
      .hidden {
        display: none !important;
      }
      .empty {
        text-align: center;
        padding: 40px;
        color: var(--text-dim);
      }
      @media (max-width: 768px) {
        .sidebar {
          display: none;
        }
        .main {
          margin-left: 0;
        }
        .grid-2 {
          grid-template-columns: 1fr;
        }
      }
    </style>
  </head>
  <body>
    <!-- Login Screen -->
    <div id="login-screen">
      <div class="login-box">
        <h2>MCP Memory</h2>
        <input type="text" id="login-user" placeholder="Username" autocomplete="username" />
        <input
          type="password"
          id="login-pass"
          placeholder="Password (min 8 chars for new accounts)"
          autocomplete="current-password"
        />
        <button class="btn btn-primary" id="auth-btn" onclick="submitAuth()">Sign In</button>
        <p
          id="login-error"
          style="color: var(--red); font-size: 12px; margin-top: 8px; text-align: center"
        ></p>
        <p style="text-align: center; font-size: 12px; margin-top: 14px; color: var(--text-dim)">
          <a
            href="#"
            id="auth-toggle"
            onclick="toggleAuthMode(event)"
            style="color: var(--accent); text-decoration: none"
            >Create an account</a
          >
        </p>
      </div>
    </div>

    <!-- Dashboard -->
    <div id="dashboard" class="hidden">
      <div class="sidebar">
        <h1>MCP Memory</h1>
        <nav>
          <a href="#overview" data-view="overview" class="active">Overview</a>
          <a href="#memory" data-view="memory">Memory</a>
          <a href="#tasks" data-view="tasks">Tasks</a>
          <a href="#issues" data-view="issues">Issues</a>
          <a href="#agents" data-view="agents">Agents</a>
          <a href="#activity" data-view="activity">Activity</a>
          <a href="#settings" data-view="settings">Settings</a>
        </nav>
      </div>
      <div class="main">
        <div class="header">
          <h2 id="view-title">Overview</h2>
          <div id="server-status"></div>
        </div>

        <!-- Overview View -->
        <div id="view-overview">
          <div class="cards" id="stats-cards"></div>
          <div class="grid-2">
            <div class="panel">
              <h3>Recent Tasks</h3>
              <div id="recent-tasks"></div>
            </div>
            <div class="panel">
              <h3>Recent Activity</h3>
              <div id="recent-activity" class="activity-list"></div>
            </div>
          </div>
        </div>

        <!-- Memory View -->
        <div id="view-memory" class="hidden">
          <div class="search-bar">
            <input type="text" id="memory-search" placeholder="Search memory..." />
            <button class="btn btn-primary" onclick="searchMemory()">Search</button>
          </div>
          <div class="panel"><div id="memory-results"></div></div>
        </div>

        <!-- Tasks View -->
        <div id="view-tasks" class="hidden">
          <div class="panel"><div id="tasks-list"></div></div>
        </div>

        <!-- Issues View -->
        <div id="view-issues" class="hidden">
          <div class="panel"><div id="issues-list"></div></div>
        </div>

        <!-- Agents View -->
        <div id="view-agents" class="hidden">
          <div class="panel"><div id="agents-list"></div></div>
        </div>

        <!-- Activity View -->
        <div id="view-activity" class="hidden">
          <div class="panel"><div id="activity-log" class="activity-list"></div></div>
        </div>

        <!-- Settings View -->
        <div id="view-settings" class="hidden">
          <div class="panel">
            <h3>Auth</h3>
            <div id="auth-settings"></div>
          </div>
        </div>
      </div>
    </div>

    <script>
      let TOKEN = localStorage.getItem('mcp_token') || null;
      const API = '';

      async function api(method, path, body) {
        const opts = { method, headers: { 'Content-Type': 'application/json' } };
        if (TOKEN) opts.headers['Authorization'] = 'Bearer ' + TOKEN;
        if (body) opts.body = JSON.stringify(body);
        const r = await fetch(API + path, opts);
        if (r.status === 401) {
          TOKEN = null;
          localStorage.removeItem('mcp_token');
          showLogin();
          return null;
        }
        return r.json();
      }

      function showLogin() {
        document.getElementById('login-screen').classList.remove('hidden');
        document.getElementById('dashboard').classList.add('hidden');
      }

      function showDashboard() {
        document.getElementById('login-screen').classList.add('hidden');
        document.getElementById('dashboard').classList.remove('hidden');
      }

      let AUTH_MODE = 'login';

      function toggleAuthMode(e) {
        e.preventDefault();
        AUTH_MODE = AUTH_MODE === 'login' ? 'register' : 'login';
        document.getElementById('auth-btn').textContent =
          AUTH_MODE === 'login' ? 'Sign In' : 'Create Account';
        document.getElementById('auth-toggle').textContent =
          AUTH_MODE === 'login' ? 'Create an account' : 'Back to sign in';
        document.getElementById('login-error').textContent = '';
      }

      async function submitAuth() {
        const u = document.getElementById('login-user').value;
        const p = document.getElementById('login-pass').value;
        document.getElementById('login-error').textContent = '';
        if (!u || !p) {
          document.getElementById('login-error').textContent = 'Username and password required';
          return;
        }
        try {
          if (AUTH_MODE === 'register') {
            const rr = await api('POST', '/auth/register', { username: u, password: p });
            if (!rr || !rr.success) {
              document.getElementById('login-error').textContent =
                rr?.error || 'Registration failed';
              return;
            }
            // Account created - flip back to sign-in and log in with it
            AUTH_MODE = 'login';
            document.getElementById('auth-btn').textContent = 'Sign In';
            document.getElementById('auth-toggle').textContent = 'Create an account';
          }
          const r = await api('POST', '/auth/login', { username: u, password: p });
          if (r && r.success) {
            TOKEN = r.token;
            localStorage.setItem('mcp_token', r.token);
            showDashboard();
            loadView(viewFromHash());
          } else {
            document.getElementById('login-error').textContent = r?.error || 'Login failed';
          }
        } catch (e) {
          document.getElementById('login-error').textContent = 'Connection failed';
        }
      }

      // ---- Hash router ----
      // Views are addressed by URL fragment (e.g. #/memory) so every view is
      // deep-linkable, survives a refresh, and works with the browser's
      // Back/Forward buttons. Nav clicks are plain anchor navigation: the
      // browser changes the hash, which fires `hashchange` below.
      const VIEWS = ['overview', 'memory', 'tasks', 'issues', 'agents', 'activity', 'settings'];

      function viewFromHash() {
        const name = location.hash.replace(/^#\/?/, '').toLowerCase();
        return VIEWS.includes(name) ? name : 'overview';
      }

      window.addEventListener('hashchange', () => loadView(viewFromHash()));

      function loadView(name) {
        if (!VIEWS.includes(name)) name = 'overview';
        // replaceState keeps the URL in sync without adding a history entry.
        // For a real nav click the hash already matches, so this is a no-op and
        // the history entry the browser created is preserved for Back/Forward.
        // For programmatic loads (login, auto-login) it canonicalises the URL.
        history.replaceState(null, '', '#' + name);
        document
          .querySelectorAll('.sidebar nav a')
          .forEach((a) => a.classList.toggle('active', a.dataset.view === name));
        document
          .querySelectorAll('[id^="view-"]')
          .forEach((v) => v.classList.toggle('hidden', v.id !== 'view-' + name));
        document.getElementById('view-title').textContent =
          name.charAt(0).toUpperCase() + name.slice(1);
        if (name === 'overview') loadOverview();
        else if (name === 'memory') loadMemory();
        else if (name === 'tasks') loadTasks();
        else if (name === 'issues') loadIssues();
        else if (name === 'agents') loadAgents();
        else if (name === 'activity') loadActivity();
        else if (name === 'settings') loadSettings();
      }

      async function loadOverview() {
        const health = await api('GET', '/health');
        document.getElementById('server-status').innerHTML =
          health?.status === 'ok'
            ? '<span class="status-badge ok"><span class="dot"></span>Healthy</span>'
            : '<span class="status-badge err"><span class="dot"></span>Error</span>';

        const [tasks, issues, agents, activity] = await Promise.all([
          api('GET', '/task/list?limit=100'),
          api('GET', '/issue/list?limit=100'),
          api('GET', '/agent/list'),
          api('GET', '/activity?limit=100'),
        ]);

        const taskList = Array.isArray(tasks) ? tasks : [];
        const issueList = Array.isArray(issues) ? issues : [];
        const agentList = Array.isArray(agents) ? agents : [];
        const actList = Array.isArray(activity) ? activity : [];

        document.getElementById('stats-cards').innerHTML = `
    <div class="card"><div class="label">Tasks</div><div class="value">${taskList.length}</div></div>
    <div class="card"><div class="label">Issues</div><div class="value">${issueList.length}</div></div>
    <div class="card"><div class="label">Agents</div><div class="value">${agentList.length}</div></div>
    <div class="card"><div class="label">Activity</div><div class="value">${actList.length}</div></div>
  `;

        document.getElementById('recent-tasks').innerHTML =
          taskList
            .slice(0, 5)
            .map(
              (t) => `
    <div style="display:flex;justify-content:space-between;padding:8px 0;border-bottom:1px solid var(--border)">
      <span>${esc(t.title || t.task_id)}</span>
      <span class="tag ${t.status}">${t.status}</span>
    </div>`
            )
            .join('') || '<div class="empty">No tasks</div>';

        document.getElementById('recent-activity').innerHTML =
          actList
            .slice(0, 8)
            .map(
              (a) => `
    <div class="activity-item">
      <span class="activity-time">${timeAgo(a.timestamp || a.createdAt)}</span>
      <span><b>${esc(a.agent || 'system')}</b> ${esc(a.message || '')}</span>
    </div>`
            )
            .join('') || '<div class="empty">No activity</div>';
      }

      async function loadMemory() {
        document.getElementById('memory-results').innerHTML =
          '<div class="empty">Type a search query</div>';
      }

      async function searchMemory() {
        const q = document.getElementById('memory-search').value.trim();
        if (!q) return;
        const r = await api('POST', '/context/search', { query: q, limit: 20 });
        const list = Array.isArray(r) ? r : [];
        document.getElementById('memory-results').innerHTML = list.length
          ? list
              .map(
                (c) => `
    <div style="padding:12px 0;border-bottom:1px solid var(--border)">
      <div style="display:flex;justify-content:space-between">
        <b>${esc(c.summary || c.id)}</b>
        <span class="tag ${c.lifecycle || 'active'}">${c.type || 'general'}</span>
      </div>
      <div style="color:var(--text-dim);font-size:12px;margin-top:4px">${esc((c.content || '').substring(0, 150))}</div>
    </div>`
              )
              .join('')
          : '<div class="empty">No results</div>';
      }

      async function loadTasks() {
        const r = await api('GET', '/task/list?limit=50');
        const list = Array.isArray(r) ? r : [];
        document.getElementById('tasks-list').innerHTML = list.length
          ? `<table><thead><tr><th>Title</th><th>Status</th><th>Priority</th><th>Assigned</th></tr></thead><tbody>` +
            list
              .map(
                (t) =>
                  `<tr><td>${esc(t.title || t.task_id)}</td><td><span class="tag ${t.status}">${t.status}</span></td><td>${t.priority || '-'}</td><td>${esc(t.assigned_to || '-')}</td></tr>`
              )
              .join('') +
            '</tbody></table>'
          : '<div class="empty">No tasks</div>';
      }

      async function loadIssues() {
        const r = await api('GET', '/issue/list?limit=50');
        const list = Array.isArray(r) ? r : [];
        document.getElementById('issues-list').innerHTML = list.length
          ? `<table><thead><tr><th>Title</th><th>Type</th><th>Status</th></tr></thead><tbody>` +
            list
              .map(
                (i) =>
                  `<tr><td>${esc(i.title || i.issue_id)}</td><td><span class="tag ${i.type}">${i.type}</span></td><td>${i.status}</td></tr>`
              )
              .join('') +
            '</tbody></table>'
          : '<div class="empty">No issues</div>';
      }

      async function loadAgents() {
        const r = await api('GET', '/agent/list');
        const list = Array.isArray(r) ? r : [];
        document.getElementById('agents-list').innerHTML = list.length
          ? `<table><thead><tr><th>Agent</th><th>Status</th><th>Project</th><th>Last Seen</th></tr></thead><tbody>` +
            list
              .map(
                (a) =>
                  `<tr><td>${esc(a.agent_id || a.agent)}</td><td><span class="tag ${a.status}">${a.status}</span></td><td>${esc(a.project || '-')}</td><td>${timeAgo(a.last_seen)}</td></tr>`
              )
              .join('') +
            '</tbody></table>'
          : '<div class="empty">No agents</div>';
      }

      async function loadActivity() {
        const r = await api('GET', '/activity?limit=100');
        const list = Array.isArray(r) ? r : [];
        document.getElementById('activity-log').innerHTML =
          list
            .map(
              (a) => `
    <div class="activity-item">
      <span class="activity-time">${timeAgo(a.timestamp || a.createdAt)}</span>
      <span><b>${esc(a.agent || 'system')}</b> <span class="tag ${a.type}">${a.type}</span> ${esc(a.message || '')}</span>
    </div>`
            )
            .join('') || '<div class="empty">No activity</div>';
      }

      async function loadSettings() {
        const r = await api('GET', '/auth/health');
        document.getElementById('auth-settings').innerHTML =
          `<pre style="font-size:12px;color:var(--text-dim)">${JSON.stringify(r, null, 2)}</pre>`;
      }

      function esc(s) {
        const d = document.createElement('div');
        d.textContent = s;
        return d.innerHTML;
      }
      function timeAgo(t) {
        if (!t) return '-';
        const s = Math.floor((Date.now() - new Date(t)) / 1000);
        if (s < 60) return s + 's ago';
        if (s < 3600) return Math.floor(s / 60) + 'm ago';
        if (s < 86400) return Math.floor(s / 3600) + 'h ago';
        return Math.floor(s / 86400) + 'd ago';
      }

      // Auto-login if token exists
      if (TOKEN) {
        showDashboard();
        loadView(viewFromHash());
      }
    </script>
  </body>
</html>
