name: Publish to npm

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      otp:
        description: 'NPM 2FA OTP Code (if 2FA is required)'
        required: false
        type: string
      tag:
        description: 'Tag or version to publish (defaults to package.json version)'
        required: false
        type: string

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    name: Publish Package to npm
    runs-on: ubuntu-24.04
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.x
          registry-url: 'https://registry.npmjs.org'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run pre-publish verification checks
        run: |
          npm run check
          npm pack --dry-run

      - name: Publish to npm
        run: |
          if [ -n "${{ inputs.otp }}" ]; then
            npm publish --access public --otp="${{ inputs.otp }}"
          else
            npm publish --access public
          fi
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
