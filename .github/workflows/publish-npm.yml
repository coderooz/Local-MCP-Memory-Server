name: Publish to npm

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      otp:
        description: 'NPM 2FA OTP Code (if 2FA is required)'
        required: false
        type: string
      tag:
        description: 'Tag or version to publish (defaults to package.json version)'
        required: false
        type: string

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    name: Publish Package to npm
    runs-on: ubuntu-24.04
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.x
          registry-url: 'https://registry.npmjs.org'
          cache: npm

      - name: Install dependencies
        run: |
          npm ci
          npm rebuild better-sqlite3

      - name: Verify npm authentication
        run: |
          echo "Verifying npm registry authentication identity..."
          npm whoami
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Run pre-publish verification checks
        run: |
          CURRENT_VERSION=$(node -p "require('./package.json').version")
          echo "Authoritative package version: $CURRENT_VERSION"
          if [ "$CURRENT_VERSION" != "2.6.1" ]; then
            echo "::error::Attempting to publish unexpected version $CURRENT_VERSION (expected 2.6.1)"
            exit 1
          fi
          # Check duplicate publication
          if npm view local-mcp-memory@$CURRENT_VERSION version >/dev/null 2>&1; then
            echo "::notice::Version $CURRENT_VERSION is already published on npm registry."
            exit 0
          fi
          npm run check
          npm pack --dry-run

      - name: Publish to npm
        run: |
          if [ -n "${{ inputs.otp }}" ]; then
            npm publish --access public --provenance --otp="${{ inputs.otp }}" || npm publish --access public --otp="${{ inputs.otp }}"
          else
            npm publish --access public --provenance || npm publish --access public
          fi
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
