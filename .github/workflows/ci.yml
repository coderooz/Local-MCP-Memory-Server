name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-24.04
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.x
          cache: npm

      - name: Install dependencies
        run: |
          npm ci
          npm rebuild better-sqlite3

      - name: Run ESLint
        run: npm run lint
        continue-on-error: true

      - name: Check formatting
        run: npm run format:check
        continue-on-error: true

  check:
    name: Syntax Check
    runs-on: ubuntu-24.04
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.x
          cache: npm

      - name: Install dependencies
        run: |
          npm ci
          npm rebuild better-sqlite3

      - name: Run syntax checks
        run: npm run check

  test:
    name: Tests (Node ${{ matrix.node-version }})
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        node-version: [22.x]

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm

      - name: Install dependencies
        run: |
          npm ci
          npm rebuild better-sqlite3

      - name: Run test suite
        run: npm test

      - name: Run resilience tests
        run: npm run test:resilience

      - name: Run documentation consistency verification
        run: node scripts/verify-docs-consistency.mjs

      - name: Run workspace governance verification
        run: node tests/workspace-governance-test.mjs

  isolation:
    name: Isolation & Regression Harness (Node ${{ matrix.node-version }})
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        node-version: [22.x]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm

      - name: Install dependencies
        run: |
          npm ci
          npm rebuild better-sqlite3

      - name: Isolation suite (must pass)
        run: npm run test:isolation

      - name: Contract suite (must pass)
        run: npm run test:contract

      - name: Gap detectors (blocking WP-B regression gate)
        run: npm run test:gaps

  build:
    name: Build & Package Verification
    runs-on: ubuntu-24.04
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.x
          cache: npm

      - name: Install dependencies
        run: |
          npm ci
          npm rebuild better-sqlite3

      - name: Validate package.json
        run: |
          node --input-type=module -e "
            import fs from 'node:fs';
            const pkg = JSON.parse(fs.readFileSync('./package.json', 'utf8'));
            console.log('Package validation:');
            console.log('- Name:', pkg.name);
            console.log('- Version:', pkg.version);
            console.log('- Scripts:', Object.keys(pkg.scripts).length);
            console.log('- Dependencies:', Object.keys(pkg.dependencies).length);
            console.log('- All scripts defined:', pkg.scripts ? 'Yes' : 'No');
          "

      - name: Dry-run package packing
        run: npm pack --dry-run

  security:
    name: Security Audit
    runs-on: ubuntu-24.04
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.x
          cache: npm

      - name: Install dependencies
        run: |
          npm ci
          npm rebuild better-sqlite3

      - name: Run npm audit
        run: npm audit --audit-level=high
        continue-on-error: true
